worker_processes auto;

events {
    worker_connections 4096;
}

http {
    upstream app_servers {
        # Round-robin: connections distribute across all workers.
        # Room routing is handled at the application layer via Redis RPC.
        # The room registry ensures all game messages reach the owning worker
        # regardless of which worker the player's WebSocket connects to.
        server app:8000;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://app_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Timeouts for WebSocket connections
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
