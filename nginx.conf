worker_processes auto;
# Raise the per-worker FD limit. Each proxied WebSocket uses TWO sockets at nginx
# (client->nginx and nginx->gateway), so N clients need ~2N FDs. The container
# default (1024) capped total concurrent connections around ~11k regardless of
# worker_connections. Must be paired with a matching `ulimits.nofile` on the
# nginx service in docker-compose (the OS hard limit gates this directive).
worker_rlimit_nofile 131072;

events {
    # Max simultaneous connections PER worker. With 2 sockets per proxied WS,
    # this must comfortably exceed 2 * (clients / worker_processes).
    worker_connections 65536;
}

http {
    # Room-sticky load balancing across horizontally scaled gateways (Path A).
    #
    # Every player in a room must land on the SAME gateway, because fan-out is
    # per-gateway (in-process SessionRegistry). We consistent-hash on the room
    # code carried in the WS query string (/ws?room=ABC123):
    #   - joiners/reconnecters always carry ?room=CODE  -> hashed to one gateway
    #   - create_room has no code yet -> falls back to client-addr hashing; the
    #     creating gateway claims ownership in Redis, and if a later joiner hashes
    #     to a different gateway, that gateway REDIRECTS the client to the owner
    #     (see gateway sendRedirect). So correctness never depends on the hash
    #     being perfect — the hash just minimizes redirects.
    #
    # `consistent` uses ketama hashing so adding/removing a gateway only remaps
    # ~1/N of rooms rather than reshuffling everything.
    # Hash key precedence (all three are query args, at most one non-empty per
    # connection, so concatenating is deterministic):
    #   ?gw=<id>    explicit owner pin after a redirect (highest priority)
    #   ?room=CODE  joiners/reconnecters — same room => same gateway
    #   ?cid=<rand> create_room — high-cardinality per-connection id so creators
    #               spread evenly across gateways even from one source IP. This
    #               is what balances room ownership across the fleet; without it,
    #               all creates from one IP land on one gateway and overload it.
    upstream gateways {
        hash "$arg_gw$arg_room$arg_cid" consistent;
        server gateway1:9000;
        server gateway2:9000;
        server gateway3:9000;
        server gateway4:9000;
        # add more gateway replicas here (must match docker-compose / deployment)
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://gateways;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Timeouts for WebSocket connections
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
