worker_processes auto;

events {
    worker_connections 4096;
}

http {
    upstream app_servers {
        # Sticky sessions: ip_hash routes same client IP to same backend.
        # This ensures all players in a room (from different IPs) can land on
        # different workers, but a single user's WebSocket stays on one worker.
        #
        # For load testing from a single IP, comment out ip_hash to use
        # round-robin (requires Redis cross-worker support for game state).
        ip_hash;
        server app:8000;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://app_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Timeouts for WebSocket connections
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
