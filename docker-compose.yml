version: "3.9"

# Multi-worker setup with Go gateway for direct worker routing.
# Usage:
#   docker compose up --build
#   docker compose up --build --scale app=12
#
# Access: ws://localhost:9000/ws (via Go gateway, direct to workers)
# Static: http://localhost:80 (via nginx, frontend only)

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - skribbl-net

  app:
    build: .
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8000"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - skribbl-net

  gateway:
    build:
      context: ./gateway
    command: ["-port", "9000", "-redis", "redis://redis:6379", "-backends", "app:8000"]
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_started
    ports:
      - "9000:9000"
    networks:
      - skribbl-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx-static.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - skribbl-net

networks:
  skribbl-net:
    driver: bridge
