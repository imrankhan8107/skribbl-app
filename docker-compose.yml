version: "3.9"

# Production-like setup: Go gateway serves frontend + WebSocket on port 9000.
# Python workers handle game logic only (not exposed to host).
#
# Usage:
#   docker compose up --build
#   docker compose up --build --scale app=8
#
# Access: http://localhost:9000 (frontend + WebSocket, single origin)

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - skribbl-net

  app:
    build: .
    environment:
      - REDIS_URL=redis://redis:6379
      - GRPC_ENABLED=true
      - GRPC_PORT=50051
      - TRACE_ENABLED=${TRACE_ENABLED:-false}
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8000"
      - "50051"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - skribbl-net

  # Two horizontally scaled gateways behind nginx (Path A: room-sticky routing).
  # Each terminates client WebSockets and fans out per-gateway; nginx
  # consistent-hashes on ?room/?gw so a room's players converge on one gateway.
  # GATEWAY_ID must be stable and unique per replica (used for room ownership).
  gateway1:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    command: ["-port", "9000", "-redis", "redis://redis:6379", "-backends", "app:8000", "-static", "/static", "-pprof-port", "6060"]
    environment:
      - GATEWAY_ID=gateway1
      - TRACE_ENABLED=${TRACE_ENABLED:-false}
      - SEND_BUFFER=${SEND_BUFFER:-1024}  # per-client outbound queue depth (sweep 1024/2048/4096)
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_started
    expose:
      - "9000"
    networks:
      - skribbl-net

  gateway2:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    command: ["-port", "9000", "-redis", "redis://redis:6379", "-backends", "app:8000", "-static", "/static", "-pprof-port", "6060"]
    environment:
      - GATEWAY_ID=gateway2
      - TRACE_ENABLED=${TRACE_ENABLED:-false}
      - SEND_BUFFER=${SEND_BUFFER:-1024}
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_started
    expose:
      - "9000"
    networks:
      - skribbl-net

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9000:80"  # public origin — frontend + WebSocket
    depends_on:
      - gateway1
      - gateway2
    networks:
      - skribbl-net

networks:
  skribbl-net:
    driver: bridge
