version: "3.9"

# Production-like setup: Go gateway serves frontend + WebSocket on port 9000.
# Python workers handle game logic only (not exposed to host).
#
# Usage:
#   docker compose up --build
#   docker compose up --build --scale app=8
#
# Access: http://localhost:9000 (frontend + WebSocket, single origin)

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - skribbl-net

  app:
    build: .
    environment:
      - REDIS_URL=redis://redis:6379
      - GRPC_ENABLED=true
      - GRPC_PORT=50051
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8000"
      - "50051"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - skribbl-net

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    command: ["-port", "9000", "-redis", "redis://redis:6379", "-backends", "app:8000", "-static", "/static"]
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_started
    ports:
      - "9000:9000"
    networks:
      - skribbl-net

networks:
  skribbl-net:
    driver: bridge
