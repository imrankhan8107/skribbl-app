# ============================================================
# JMeter Property Overrides for Skribbl Performance Testing
# ============================================================
# Usage: jmeter -n -t test.jmx -q jmeter/jmeter-overrides.properties
# ============================================================

# --- Result File Configuration ---
# Save all relevant data for post-analysis
jmeter.save.saveservice.output_format=csv
jmeter.save.saveservice.response_data=false
jmeter.save.saveservice.sampler_data=false
jmeter.save.saveservice.requestHeaders=false
jmeter.save.saveservice.url=true
jmeter.save.saveservice.responseHeaders=false
jmeter.save.saveservice.assertion_results_failure_message=true
jmeter.save.saveservice.thread_counts=true
jmeter.save.saveservice.idle_time=true
jmeter.save.saveservice.connect_time=true
jmeter.save.saveservice.bytes=true
jmeter.save.saveservice.sent_bytes=true
jmeter.save.saveservice.latency=true
jmeter.save.saveservice.timestamp_format=ms

# --- HTTP Sampler Configuration ---
httpclient4.retrycount=0
httpclient.timeout=10000

# --- Summary Output (console during non-GUI) ---
summariser.name=summary
summariser.interval=15
summariser.log=true
summariser.out=true

# --- Thread Behavior ---
# Graceful shutdown timeout (seconds)
jmeterengine.force.system.exit=true
jmeter.exit.check.pause=2000

# --- WebSocket Plugin Tuning ---
# Increase buffer for large stroke messages
websocket.result.size.limit=1048576

# --- Memory & Performance ---
# Disable listeners that consume memory in non-GUI mode
jmeter.save.saveservice.response_data.on_error=true

# --- Distributed Testing (uncomment for multi-machine) ---
